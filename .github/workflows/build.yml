name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        env:
          # The shared Sahl key (same secrets as every Sahl app) — required for Sahl Union
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          SIGNING_KEY_ALIAS: sahl
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "The Sahl signing key is required. Add the KEYSTORE_B64 and KEYSTORE_PASS secrets (same as the other Sahl apps)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          python -m unittest discover -s scripts -p 'test_*.py'
          bash gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon
          apk="SahlQibla-v1.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          python scripts/make_update_manifest.py "$apk" app/build/outputs/apk/release/output-metadata.json update.json
      - uses: actions/upload-artifact@v4
        with:
          name: SahlQibla-apk
          path: |
            SahlQibla-v1.*.apk
            update.json
      - name: Publish APK and update metadata together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python -c 'import json; print(json.load(open("update.json"))["versionName"])')"
          tag="v${version}"
          apk="SahlQibla-v1.${GITHUB_RUN_NUMBER}.apk"
          gh release create "$tag" "$apk" update.json --draft --target "$GITHUB_SHA" --title "Sahl Qibla ${tag}" \
            --notes "$(git log -1 --format=%s)"
          gh release edit "$tag" --draft=false --latest
